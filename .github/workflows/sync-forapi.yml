name: Sync upstream

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: Official rustdesk/rustdesk-server release tag
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: sync-forapi
  cancel-in-progress: false

jobs:
  sync:
    name: Merge official upstream
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out forapi
        uses: actions/checkout@v4
        with:
          ref: forapi
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config remote.origin.fetch '+refs/heads/*:refs/remotes/origin/*'

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev libclang-dev pkg-config

      - name: Sync with upstream
        env:
          UPSTREAM_URL: https://github.com/rustdesk/rustdesk-server.git
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        run: ./scripts/sync-forapi.sh "$UPSTREAM_TAG"

      - name: Report conflict guidance
        if: failure()
        run: |
          echo "::error::Official upstream merge failed. Resolve the conflict locally on forapi, push it, then rerun the workflow."
